[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-migration-engine"
version = "0.1.0"
description = "Decode Power BI files into a migration workbook for Incorta, QuickSight and Tableau"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pbixray==0.15.5",
    "sqlglot==30.33.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pbi-insights = "pbi_insights.cli:main"

[tool.setuptools.packages.find]
include = ["pbi_insights*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
